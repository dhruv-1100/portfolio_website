name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        run: npm ci

      # This repo deploys as a GitHub Pages *project* site, so it is served
      # from /portfolio_website/ rather than the domain root. Without the
      # basePath the exported _next/* asset URLs 404.
      # If a custom domain is added later, set both of these to "" and the
      # domain respectively.
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /portfolio_website
          NEXT_PUBLIC_SITE_URL: https://dhruv-1100.github.io/portfolio_website

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
